name: galaxy_truck
description: "A robust, enterprise-level truck rental and fleet management platform, seamlessly connecting drivers and administrators to streamline operations from booking to maintenance with precision and ease."
publish_to: "none"
version: 1.0.0

environment:
  sdk: ^3.6.0

dependencies:
  firebase_storage: ^13.0.0
  cloud_firestore: '>=5.5.0'
  firebase_auth: '>=5.3.3'
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  provider: ^6.1.2
  go_router: ^16.2.0
  shared_preferences: ^2.0.0
  intl: 0.20.2
  image_picker: '>=1.1.2'
  signature: ^6.0.0
  pdf: ^3.0.0
  printing: ^5.0.0
  path_provider: ^2.0.0
  geolocator: 13.0.4
  permission_handler: ^12.0.0
  google_maps_flutter: ^2.0.0
  flutter_local_notifications: ^20.0.0
  uuid: ^4.0.0
  file_picker: '>=8.1.2'
  firebase_core: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/dreamflow_icon.jpg
  remove_alpha_ios: true
